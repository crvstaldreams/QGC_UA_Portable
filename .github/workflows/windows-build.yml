name: Build QGroundControl UA for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'scripts/**'
      - 'tools/**'
      - 'patches/**'
      - 'custom/**'
      - 'translations/**'

concurrency:
  group: qgc-ua-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QGC_COMMIT: e0816c957602789200ae5ba0af45217f0f2f1db4
  QT_VERSION: 6.8.3
  GST_VERSION: 1.22.12
jobs:
  build-windows:
    name: Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      BUILD_DIR: ${{ github.workspace }}\build
      QGC_DIR: ${{ github.workspace }}\qgroundcontrol
      ARTIFACT_DIR: ${{ github.workspace }}\artifacts

    steps:
      - name: Checkout CI overlay repository
        uses: actions/checkout@v4

      - name: Checkout pinned QGroundControl v5.0.8
        uses: actions/checkout@v4
        with:
          repository: mavlink/qgroundcontrol
          ref: e0816c957602789200ae5ba0af45217f0f2f1db4
          path: qgroundcontrol
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Ukrainian localization rules
        shell: pwsh
        working-directory: ${{ github.workspace }}\tools
        run: python -m unittest -v test_localization_rules.py

      - name: Test service mode contract
        shell: pwsh
        working-directory: ${{ github.workspace }}\tools
        run: python -m unittest -v test_service_mode_contract.py

      - name: Test Vsratyi localization mode
        shell: pwsh
        working-directory: ${{ github.workspace }}\tools
        run: python -m unittest -v test_vsratyi_translation.py

      - name: Cache Ukrainian translations
        uses: actions/cache@v4
        with:
          path: translation-cache
          key: qgc-uk-${{ env.QGC_COMMIT }}-${{ hashFiles('tools/generate_ukrainian_translations.py', 'translations/uk_manual_overrides.json') }}

      - name: Install Ukrainian translation engine
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "argostranslate==1.11.0"

      - name: Prepare QGC UA source tree
        shell: pwsh
        run: >-
          ./scripts/prepare-qgc.ps1
          -QgcRoot "${{ env.QGC_DIR }}"
          -OverlayRoot "${{ github.workspace }}"
          -ExpectedCommit "${{ env.QGC_COMMIT }}"

      - name: Install Vulkan SDK
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile vulkan-sdk.exe
          .\vulkan-sdk.exe --root C:\VulkanSDK\latest --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.glm com.lunarg.vulkan.volk com.lunarg.vulkan.vma com.lunarg.vulkan.debug
          "VULKAN_SDK=C:\VulkanSDK\latest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install GStreamer
        uses: blinemedical/setup-gstreamer@v1
        with:
          version: ${{ env.GST_VERSION }}

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install Qt 6.8.3 for MSVC 2022 x64
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          dir: ${{ runner.temp }}
          modules: qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
          cache: true

      - name: Set up Visual Studio 2022 shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Release build
        shell: cmd
        run: >-
          "${{ env.QT_ROOT_DIR }}\bin\qt-cmake.bat"
          -S "${{ env.QGC_DIR }}"
          -B "${{ env.BUILD_DIR }}"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQGC_STABLE_BUILD=ON
          -DQGC_UA_LICENSE_DIR="${{ env.QGC_DIR }}\custom\licenses\third-party"

      - name: Build Release
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "build-output.log"
          & cmake --build "$env:BUILD_DIR" --target all --config Release *> $log
          $exitCode = $LASTEXITCODE
          Get-Content -Path $log
          if ($exitCode -ne 0) {
              Write-Error "Build failed with exit code $exitCode. Full compiler output saved to $log"
              exit $exitCode
          }

      - name: Sanity check QGroundControl-UA executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:BUILD_DIR "Release\QGroundControl-UA.exe"
          if (-not (Test-Path $exe)) { throw "Expected executable missing: $exe" }

          Write-Host "Running simple boot test: $exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--simple-boot-test" -PassThru -Wait
          $exitCode = $process.ExitCode
          Write-Host "Simple boot test exit code: $exitCode"

          if ($exitCode -ne 0) {
              throw "QGroundControl-UA.exe --simple-boot-test failed with exit code $exitCode"
          }

      - name: Full GUI boot test
        shell: pwsh
        run: |
          $exe = Join-Path $env:BUILD_DIR "Release\QGroundControl-UA.exe"
          Write-Host "Running full UI boot test: $exe"

          $stdout = Join-Path $env:GITHUB_WORKSPACE "ui-boot-stdout.log"
          $stderr = Join-Path $env:GITHUB_WORKSPACE "ui-boot-stderr.log"

          $process = Start-Process -FilePath $exe -ArgumentList "--ui-boot-test" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $exited = $process.WaitForExit(15000)

          if (-not $exited) {
              Write-Host "Full UI boot test timed out. Killing hung process PID $($process.Id)."
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "QGroundControl-UA.exe --ui-boot-test hung for more than 15 seconds"
          }

          $process.Refresh()
          $exitCode = $process.ExitCode
          Write-Host "Full UI boot test exit code: $exitCode"

          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }

          if ($exitCode -ne 0) {
              throw "QGroundControl-UA.exe --ui-boot-test failed with exit code $exitCode"
          }

      - name: Create staging tree and Windows installer
        shell: cmd
        run: cmake --install "${{ env.BUILD_DIR }}" --config Release

      - name: Verify staged portable runtime
        shell: pwsh
        run: |
          $stagedExe = Join-Path $env:BUILD_DIR "staging\bin\QGroundControl-UA.exe"
          if (-not (Test-Path $stagedExe)) {
              throw "Staged executable missing: $stagedExe"
          }

          $portableRoot = Join-Path (Split-Path $stagedExe -Parent) "PortableData"
          if (Test-Path $portableRoot) {
              Remove-Item $portableRoot -Recurse -Force
          }

          Write-Host "Running staged portable boot test: $stagedExe"
          $process = Start-Process -FilePath $stagedExe -ArgumentList "--simple-boot-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
              throw "Staged portable boot test failed with exit code $($process.ExitCode)"
          }

          $requiredDirs = @("Settings", "Files", "Cache", "Temp", "Config")
          foreach ($dirName in $requiredDirs) {
              $dirPath = Join-Path $portableRoot $dirName
              if (-not (Test-Path $dirPath -PathType Container)) {
                  throw "Portable directory missing after boot test: $dirPath"
              }
          }

          $settingsIni = Get-ChildItem -Path (Join-Path $portableRoot "Settings") -Recurse -File -Filter "*.ini" -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if (-not $settingsIni) {
              throw "Portable QSettings INI file was not created under $portableRoot\Settings"
          }

          Write-Host "Portable runtime verified."
          Write-Host "Settings file: $($settingsIni.FullName)"
          Get-ChildItem -Path $portableRoot -Force | Select-Object Name, FullName

      - name: Package installer and portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:ARTIFACT_DIR | Out-Null

          $expectedInstaller = Join-Path $env:BUILD_DIR "QGroundControl-UA-installer.exe"
          if (-not (Test-Path $expectedInstaller)) {
              $candidate = Get-ChildItem -Path $env:BUILD_DIR -Recurse -File -Filter "*installer*.exe" | Sort-Object Length -Descending | Select-Object -First 1
              if (-not $candidate) { throw "Windows installer was not generated" }
              $expectedInstaller = $candidate.FullName
          }
          Copy-Item $expectedInstaller (Join-Path $env:ARTIFACT_DIR "QGroundControl-UA-installer.exe") -Force

          $staging = Join-Path $env:BUILD_DIR "staging"
          if (-not (Test-Path $staging)) { throw "Staging directory missing: $staging" }
          $portable = Join-Path $env:ARTIFACT_DIR "QGroundControl-UA-portable.zip"
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $portable -CompressionLevel Optimal -Force

          $installerOut = Join-Path $env:ARTIFACT_DIR "QGroundControl-UA-installer.exe"
          $hashes = @(
              "$( (Get-FileHash $installerOut -Algorithm SHA256).Hash.ToLower() )  QGroundControl-UA-installer.exe",
              "$( (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower() )  QGroundControl-UA-portable.zip"
          )
          $hashes | Set-Content -Path (Join-Path $env:ARTIFACT_DIR "SHA256SUMS.txt") -Encoding ascii

          @(
              "QGC upstream tag: v5.0.8",
              "QGC upstream commit: $env:QGC_COMMIT",
              "Qt: $env:QT_VERSION",
              "GStreamer: $env:GST_VERSION",
              "Portable data root: bin/PortableData",
              "Runner: $env:RUNNER_OS $env:RUNNER_ARCH",
              "GitHub run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content -Path (Join-Path $env:ARTIFACT_DIR "build-metadata.txt") -Encoding utf8

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-UA-Windows
          path: |
            artifacts/QGroundControl-UA-installer.exe
            artifacts/QGroundControl-UA-portable.zip
            artifacts/SHA256SUMS.txt
            artifacts/build-metadata.txt
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnostic logs
        if: always()
        shell: pwsh
        run: |
          $logDir = Join-Path $env:GITHUB_WORKSPACE "ci-logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $buildOutput = Join-Path $env:GITHUB_WORKSPACE "build-output.log"
          if (Test-Path $buildOutput) {
              Copy-Item $buildOutput (Join-Path $logDir "build-output.log") -Force
          }
          foreach ($uiBootLogName in @("ui-boot-stdout.log","ui-boot-stderr.log")) {
              $uiBootLog = Join-Path $env:GITHUB_WORKSPACE $uiBootLogName
              if (Test-Path $uiBootLog) {
                  Copy-Item $uiBootLog (Join-Path $logDir $uiBootLogName) -Force
              }
          }
          if (Test-Path $env:BUILD_DIR) {
              Get-ChildItem -Path $env:BUILD_DIR -Recurse -File -Include "CMakeCache.txt","CMakeConfigureLog.yaml","*.log" -ErrorAction SilentlyContinue |
                ForEach-Object {
                    $safe = ($_.FullName.Substring($env:BUILD_DIR.Length).TrimStart('\') -replace '[\\/:*?"<>|]', '_')
                    Copy-Item $_.FullName (Join-Path $logDir $safe) -Force -ErrorAction SilentlyContinue
                }
          }
          git -C $env:QGC_DIR status --short | Set-Content -Path (Join-Path $logDir "qgc-git-status.txt") -Encoding utf8

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-UA-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14
