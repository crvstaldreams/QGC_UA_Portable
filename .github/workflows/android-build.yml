name: Build QGroundControl UA for Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/android-build.yml'
      - 'scripts/**'
      - 'tools/**'
      - 'patches/**'
      - 'custom/**'
      - 'translations/**'

concurrency:
  group: qgc-ua-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QGC_COMMIT: e0816c957602789200ae5ba0af45217f0f2f1db4
  QGC_TRANSLATIONS_REF: master
  QT_VERSION: 6.8.3
  QT_ANDROID_ABIS: arm64-v8a

jobs:
  build-android:
    name: Android arm64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout CI overlay repository
        uses: actions/checkout@v4

      - name: Checkout pinned QGroundControl v5.0.8
        uses: actions/checkout@v4
        with:
          repository: mavlink/qgroundcontrol
          ref: ${{ env.QGC_COMMIT }}
          path: qgroundcontrol
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test service mode contract
        working-directory: tools
        run: python -m unittest -v test_service_mode_contract.py

      - name: Prepare QGC UA source tree
        shell: pwsh
        run: >-
          ./scripts/prepare-qgc.ps1
          -QgcRoot "${{ github.workspace }}/qgroundcontrol"
          -OverlayRoot "${{ github.workspace }}"
          -ExpectedCommit "${{ env.QGC_COMMIT }}"
          -TranslationRef "${{ env.QGC_TRANSLATIONS_REF }}"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          large-packages: false

      - name: Install QGC host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libgl1-mesa-dev libpulse-dev libudev-dev libxkbcommon-x11-0

      - name: Install Qt 6.8.3 host and Android arm64
        run: |
          python -m pip install --upgrade aqtinstall
          mkdir -p "$RUNNER_TEMP/Qt"
          python -m aqt install-qt linux desktop ${QT_VERSION} linux_gcc_64 -O "$RUNNER_TEMP/Qt" -m qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
          python -m aqt install-qt linux android ${QT_VERSION} android_arm64_v8a -O "$RUNNER_TEMP/Qt" -m qtcharts qtlocation qtpositioning qtspeech qt5compat qtmultimedia qtserialport qtimageformats qtshadertools qtconnectivity qtquick3d qtsensors
          echo "QT_HOST_PATH=$RUNNER_TEMP/Qt/${QT_VERSION}/gcc_64" >> "$GITHUB_ENV"
          echo "QT_ANDROID_PATH=$RUNNER_TEMP/Qt/${QT_VERSION}/android_arm64_v8a" >> "$GITHUB_ENV"

      - name: Configure Android Release
        run: |
          cmake -S qgroundcontrol -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ANDROID_PATH/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DQT_ANDROID_ABIS="${QT_ANDROID_ABIS}" \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DQGC_STABLE_BUILD=ON \
            -DQT_ANDROID_SIGN_APK=OFF \
            -DQT_DEBUG_FIND_PACKAGE=ON

      - name: Build Android APK
        run: cmake --build build-android --target all --config Release

      - name: Collect APK
        run: |
          mkdir -p artifacts
          APK="$(find build-android -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/QGroundControl-UA-Android-arm64.apk
          sha256sum artifacts/QGroundControl-UA-Android-arm64.apk > artifacts/SHA256SUMS-Android.txt

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: QGroundControl-UA-Android
          path: |
            artifacts/QGroundControl-UA-Android-arm64.apk
            artifacts/SHA256SUMS-Android.txt
          if-no-files-found: error
          retention-days: 14
